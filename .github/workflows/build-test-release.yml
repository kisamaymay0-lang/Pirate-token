name: Build test plugin release

on:
  push:
    branches:
      - arena/3a754546-pirate-token

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean package 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostics=$(grep -E '^\[ERROR\]' build.log | tail -n 20 | tr '\n' ' ')
            diagnostics=${diagnostics//'%'/'%25'}
            diagnostics=${diagnostics//$'\r'/'%0D'}
            diagnostics=${diagnostics//$'\n'/'%0A'}
            echo "::error title=Maven build diagnostics::$diagnostics"
            exit "$status"
          fi

      - name: Publish downloadable test JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: piratechesttoken-test
          name: PirateChestToken test build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: target/pirate-chest-token-1.0.0.jar
