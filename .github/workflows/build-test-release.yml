name: Build test plugin release

on:
  push:
    branches:
      - arena/3a754546-pirate-token

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Publish downloadable test JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: piratechesttoken-test
          name: PirateChestToken test build
          prerelease: true
          make_latest: false
          files: target/pirate-chest-token-1.0.0.jar
